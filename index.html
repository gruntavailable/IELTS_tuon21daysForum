<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Marathon 21 Day — Luyện đề Ngày 1–21</title>
<link rel="stylesheet" href="src/css/styles.css">
<script>
  /* set the theme before first paint so the page never flashes the wrong one */
  (function(){
    try{
      var s = JSON.parse(localStorage.getItem("ielts_m21_16")||"{}");
      var t = s.__theme || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", t);
    }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
  })();
</script>
</head>
<body>
<div id="app">
  <nav id="side">
    <h1>IELTS Marathon 21 Day</h1>
    <div class="sub">Companion — Luyện đề Ngày 1–21</div>
    <div id="nav"></div>

    <div id="timerBox"></div>

    <div class="tools">
      <div class="toolrow" style="margin-bottom:5px">
        <button class="btn sm" id="btnTheme">🌙  Chế độ tối</button>
        <button class="btn sm" id="btnClearHl" title="Xoá mọi vùng bôi màu ở trang đang xem">🖍  Xoá màu</button>
      </div>
      <button class="btn sm" id="btnReset" style="width:100%" title="Xoá toàn bộ bài làm, bảng theo dõi và bài viết đã lưu">Xoá toàn bộ bài làm</button>
      <p style="font-size:11px;color:var(--tx2);margin:8px 0 0;line-height:1.5">Bôi đen nội dung bằng chuột để chọn màu. Bấm vào vùng đã bôi để xoá.</p>
    </div>
  </nav>

  <div id="wrap">
    <main id="main"></main>
  </div>
</div>

<div id="bar">
  <div id="barIn">
    <span class="s">Ngày <b id="bDay">1</b></span>
    <span id="bQuiz" style="display:contents">
      <span class="s">Đã làm <b id="bDone">0</b>/<b id="bTot">0</b></span>
      <span class="s">Đúng <span class="pill g" id="bOk">0</span> Sai <span class="pill r" id="bBad">0</span></span>
      <span class="s">Độ chính xác <b id="bPct">–</b></span>
    </span>
    <span id="bTrk" class="hidden" style="display:contents">
      <span class="s">Ngày đã hoàn thành <span class="pill g" id="bTrkDone">0</span>/<b id="bTrkTot">21</b></span>
      <span class="s">Tiến độ lộ trình <b id="bTrkPct">0%</b></span>
    </span>
    <span id="bVoc" class="hidden" style="display:contents">
      <span class="s">Từ đã lưu <b id="bVocTot">0</b></span>
      <span class="s">Đã có câu tự viết <span class="pill g" id="bVocDone">0</span></span>
    </span>
    <span style="margin-left:auto"><button class="btn sm" id="btnRevealAll">Hiện hết đáp án ngày này</button></span>
  </div>
</div>

<script type="module" src="src/js/app.js"></script>
</body>
</html>
